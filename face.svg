<svg xmlns="http://www.w3.org/2000/svg" width="300" height="340" viewBox="0 0 300 340" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <clipPath id="box"><rect x="2" y="2" width="296" height="336" rx="14"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .s { fill: none; stroke: #38bdf8; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; stroke-opacity: 0.6; stroke-dasharray: 1; stroke-dashoffset: 1; }
      .thin { stroke-width: 1; stroke-opacity: 0.4; }
      .bold { stroke-width: 3; stroke-opacity: 0.7; }
      .d1 { animation: d1 16s ease-in-out infinite; }
      .d2 { animation: d2 16s ease-in-out infinite; }
      .d3 { animation: d3 16s ease-in-out infinite; }
      .d4 { animation: d4 16s ease-in-out infinite; }
      .d5 { animation: d5 16s ease-in-out infinite; }
      @keyframes d1 { 0%,2% { stroke-dashoffset: 1 } 20%,92% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 1 } }
      @keyframes d2 { 0%,10% { stroke-dashoffset: 1 } 28%,92% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 1 } }
      @keyframes d3 { 0%,18% { stroke-dashoffset: 1 } 36%,92% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 1 } }
      @keyframes d4 { 0%,28% { stroke-dashoffset: 1 } 44%,92% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 1 } }
      @keyframes d5 { 0%,40% { stroke-dashoffset: 1 } 55%,92% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 1 } }
      .code { fill: #38bdf8; fill-opacity: 0.18; font-size: 14px; }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    </style>
  </defs>

  <rect x="2" y="2" width="296" height="336" rx="14" fill="url(#bg)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="2" y="2" width="296" height="38" rx="14" fill="#020617" fill-opacity="0.6"/>
  <circle cx="26" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="21" r="6" fill="#27c93f"/>
  <text x="170" y="26" fill="#94a3b8" font-size="13" text-anchor="middle">sketch.svg</text>

  <g clip-path="url(#box)">
    <!-- faint code glyphs -->
    <g class="float"><text class="code" x="22" y="80">&lt;/&gt;</text></g>
    <g class="float" style="animation-delay:-2s"><text class="code" x="248" y="110">{ }</text></g>
    <g class="float" style="animation-delay:-4s"><text class="code" x="30" y="300">;</text></g>
    <g class="float" style="animation-delay:-1s"><text class="code" x="252" y="290">=&gt;</text></g>

    <!-- sketch -->
    <g transform="translate(18,18) scale(0.88)" filter="url(#glow)">
      <!-- hair -->
      <path class="s d1" pathLength="1" d="M64 150 C58 110 62 70 100 50 C130 38 180 36 210 52 C240 68 244 110 236 150"/>
      <path class="s d1" pathLength="1" d="M66 140 C70 110 95 92 130 88 C165 84 205 92 232 130"/>
      <path class="s d1 thin" pathLength="1" d="M130 50 C150 70 190 80 232 108"/>
      <path class="s d1 thin" pathLength="1" d="M110 52 C120 75 150 90 200 98"/>
      <path class="s d1 thin" pathLength="1" d="M90 62 C95 80 110 95 135 98"/>
      <path class="s d1 thin" pathLength="1" d="M70 100 C74 120 72 135 70 150"/>
      <path class="s d1 thin" pathLength="1" d="M230 100 C226 120 228 135 230 150"/>

      <!-- face contour + ears -->
      <path class="s d2" pathLength="1" d="M66 150 C66 200 78 250 105 280 C120 294 135 298 150 298 C165 298 180 294 195 280 C222 250 234 200 234 150"/>
      <path class="s d2" pathLength="1" d="M66 170 C54 168 52 195 62 215 C65 222 70 224 72 222"/>
      <path class="s d2" pathLength="1" d="M234 170 C246 168 248 195 238 215 C235 222 230 224 228 222"/>
      <path class="s d2 thin" pathLength="1" d="M138 286 C148 290 152 290 162 286"/>

      <!-- brows + eyes -->
      <path class="s d3 bold" pathLength="1" d="M90 151 C105 142 125 142 138 148"/>
      <path class="s d3 bold" pathLength="1" d="M162 148 C176 141 198 141 212 151"/>
      <path class="s d3" pathLength="1" d="M98 168 C106 160 122 160 130 168 C122 174 106 174 98 168 Z"/>
      <path class="s d3" pathLength="1" d="M170 168 C178 160 194 160 202 168 C194 174 178 174 170 168 Z"/>
      <circle class="s d3" pathLength="1" cx="114" cy="167" r="4.5"/>
      <circle class="s d3" pathLength="1" cx="186" cy="167" r="4.5"/>
      <path class="s d3 thin" pathLength="1" d="M100 178 C108 182 120 182 128 178"/>
      <path class="s d3 thin" pathLength="1" d="M172 178 C180 182 192 182 200 178"/>

      <!-- nose -->
      <path class="s d4" pathLength="1" d="M142 170 C140 190 138 200 134 212"/>
      <path class="s d4" pathLength="1" d="M158 170 C160 190 162 200 166 212"/>
      <path class="s d4" pathLength="1" d="M134 214 C140 220 160 220 166 214"/>
      <path class="s d4 thin" pathLength="1" d="M142 212 C146 216 154 216 158 212"/>

      <!-- mustache shadow, mouth -->
      <path class="s d5 thin" pathLength="1" stroke-dasharray="0.02 0.03" d="M124 232 C136 228 164 228 176 232"/>
      <path class="s d5" pathLength="1" d="M124 244 C136 240 144 240 150 242 C156 240 164 240 176 244"/>
      <path class="s d5" pathLength="1" d="M126 246 C142 247 158 247 174 246"/>
      <path class="s d5 thin" pathLength="1" d="M128 248 C142 258 158 258 172 248"/>

      <!-- neck, collar, jacket -->
      <path class="s d5 thin" pathLength="1" d="M118 290 L114 320"/>
      <path class="s d5 thin" pathLength="1" d="M182 290 L186 320"/>
      <path class="s d5" pathLength="1" d="M128 322 L150 345 L172 322"/>
      <path class="s d5" pathLength="1" d="M60 345 L100 308 L130 326"/>
      <path class="s d5" pathLength="1" d="M240 345 L200 308 L170 326"/>
    </g>

    <!-- scan line -->
    <rect x="12" y="50" width="276" height="2" fill="#38bdf8" fill-opacity="0.25">
      <animate attributeName="y" values="50;300;50" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
